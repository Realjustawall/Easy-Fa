name: Publish Easy-Fa 0.4.6

on:
  push:
    branches: [main]
    paths:
      - '.release/0.4.6/**'
      - '.github/workflows/publish-0.4.6.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'Realjustawall/Easy-Fa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact 0.4.6 source
        shell: bash
        run: |
          set -euo pipefail
          cat .release/0.4.6/part* > /tmp/easyfa-0.4.6-src.tgz
          tar -xzf /tmp/easyfa-0.4.6-src.tgz -C .
          python - <<'PY'
          import json
          with open('manifest.json', encoding='utf-8') as f:
              m = json.load(f)
          assert m['version'] == '0.4.6', m['version']
          PY
          rm -rf .release/0.4.6
          rm -f .github/workflows/publish-0.4.6.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'release: Easy-Fa 0.4.6'
            git push origin HEAD:main
          fi
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build release ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f Easy-Fa-0.4.6.zip
          zip -r Easy-Fa-0.4.6.zip . \
            -x '.git/*' \
               '.github/*' \
               'Easy-Fa-0.4.6.zip' \
               'PUSH_TO_GITHUB.md' \
               'RELEASE_NOTES_0.4.6.md'
          unzip -t Easy-Fa-0.4.6.zip >/dev/null

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.4.6 >/dev/null 2>&1; then
            gh release upload v0.4.6 Easy-Fa-0.4.6.zip --clobber
            gh release edit v0.4.6 \
              --title 'Easy-Fa 0.4.6' \
              --notes-file RELEASE_NOTES_0.4.6.md \
              --latest
          else
            gh release create v0.4.6 Easy-Fa-0.4.6.zip \
              --target "$FINAL_SHA" \
              --title 'Easy-Fa 0.4.6' \
              --notes-file RELEASE_NOTES_0.4.6.md \
              --latest
          fi
